<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4000 3000" width="4000" height="3000">
  <!-- Тимчасова карта світу Ashlands. Замінити на справжню (той самий розмір 4000×3000 або оновити розмір у server/services/world.js). -->
  <defs>
    <radialGradient id="sea" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a2f33"/>
      <stop offset="1" stop-color="#15181b"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b5d47"/>
      <stop offset="0.5" stop-color="#5a4e3c"/>
      <stop offset="1" stop-color="#463c2f"/>
    </linearGradient>
    <radialGradient id="ash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2b2723" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2b2723" stop-opacity="0"/>
    </radialGradient>
    <pattern id="waves" width="120" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 q30 -14 60 0 t60 0" fill="none" stroke="#3a4248" stroke-width="3" opacity="0.5"/>
    </pattern>
    <g id="mountain">
      <path d="M-60 40 L0 -55 L60 40 Z" fill="#3d342a" stroke="#1e1915" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 -55 L18 40 L60 40 Z" fill="#2c251e"/>
      <path d="M0 -55 L-14 -32 L0 -36 L12 -30 Z" fill="#8a8073"/>
    </g>
    <g id="tree">
      <path d="M0 -38 L24 14 L-24 14 Z" fill="#2e3326" stroke="#171a13" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-4" y="14" width="8" height="12" fill="#1e1915"/>
    </g>
    <g id="deadtree">
      <path d="M0 26 L0 -30 M0 -8 L-18 -24 M0 -16 L16 -34 M0 4 L14 -8" stroke="#1e1915" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- Море -->
  <rect width="4000" height="3000" fill="url(#sea)"/>
  <rect width="4000" height="3000" fill="url(#waves)"/>

  <!-- Головний материк -->
  <path d="M620 760 C 720 520, 1080 420, 1380 470 C 1660 380, 1980 330, 2320 420 C 2640 360, 3020 420, 3260 600
           C 3480 760, 3520 1000, 3420 1220 C 3560 1420, 3500 1720, 3300 1900 C 3200 2160, 2900 2380, 2560 2420
           C 2300 2560, 1960 2600, 1700 2500 C 1420 2560, 1120 2480, 940 2300 C 700 2220, 520 2000, 560 1760
           C 420 1560, 440 1300, 560 1140 C 500 1000, 520 860, 620 760 Z"
        fill="url(#land)" stroke="#1e1915" stroke-width="10"/>
  <!-- Берегова лінія (світла смуга) -->
  <path d="M620 760 C 720 520, 1080 420, 1380 470 C 1660 380, 1980 330, 2320 420 C 2640 360, 3020 420, 3260 600
           C 3480 760, 3520 1000, 3420 1220 C 3560 1420, 3500 1720, 3300 1900 C 3200 2160, 2900 2380, 2560 2420
           C 2300 2560, 1960 2600, 1700 2500 C 1420 2560, 1120 2480, 940 2300 C 700 2220, 520 2000, 560 1760
           C 420 1560, 440 1300, 560 1140 C 500 1000, 520 860, 620 760 Z"
        fill="none" stroke="#8a7a5f" stroke-width="4" opacity="0.5" transform="translate(0 -6)"/>

  <!-- Острів на південному заході -->
  <path d="M260 2500 C 300 2360, 480 2330, 600 2420 C 700 2500, 660 2660, 520 2700 C 380 2740, 230 2640, 260 2500 Z"
        fill="url(#land)" stroke="#1e1915" stroke-width="8"/>
  <!-- Острів на сході -->
  <path d="M3620 2200 C 3680 2080, 3840 2090, 3880 2200 C 3920 2320, 3800 2420, 3700 2380 C 3610 2350, 3580 2280, 3620 2200 Z"
        fill="url(#land)" stroke="#1e1915" stroke-width="8"/>

  <!-- Попелясті пустища -->
  <ellipse cx="2350" cy="1650" rx="520" ry="300" fill="url(#ash)"/>
  <ellipse cx="2950" cy="1450" rx="300" ry="220" fill="url(#ash)"/>

  <!-- Річки -->
  <path d="M1650 700 C 1600 900, 1720 1100, 1680 1300 C 1640 1450, 1720 1520, 1700 1600 C 1680 1900, 1500 2150, 1380 2520"
        fill="none" stroke="#2a3238" stroke-width="16" stroke-linecap="round"/>
  <path d="M2700 950 C 2600 1050, 2650 1200, 2550 1300 C 2450 1400, 2200 1380, 1700 1520"
        fill="none" stroke="#2a3238" stroke-width="11" stroke-linecap="round"/>

  <!-- Гори: північний хребет -->
  <use href="#mountain" x="2150" y="620"/>
  <use href="#mountain" x="2260" y="580"/>
  <use href="#mountain" x="2370" y="640"/>
  <use href="#mountain" x="2480" y="600"/>
  <use href="#mountain" x="2600" y="660"/>
  <use href="#mountain" x="2720" y="620"/>
  <use href="#mountain" x="2830" y="700"/>
  <use href="#mountain" x="2310" y="720"/>
  <use href="#mountain" x="2550" y="760"/>
  <!-- Гори: західний хребет -->
  <use href="#mountain" x="760" y="1260"/>
  <use href="#mountain" x="700" y="1380"/>
  <use href="#mountain" x="780" y="1500"/>
  <use href="#mountain" x="690" y="1620"/>
  <!-- Гори: південний схід -->
  <use href="#mountain" x="3080" y="1900"/>
  <use href="#mountain" x="3190" y="1820"/>
  <use href="#mountain" x="2980" y="2000"/>

  <!-- Ліси -->
  <g>
    <use href="#tree" x="1000" y="700"/><use href="#tree" x="1060" y="740"/><use href="#tree" x="1120" y="690"/>
    <use href="#tree" x="960" y="790"/><use href="#tree" x="1030" y="820"/><use href="#tree" x="1100" y="790"/>
    <use href="#tree" x="1170" y="760"/><use href="#tree" x="1240" y="720"/><use href="#tree" x="1300" y="780"/>
    <use href="#tree" x="1900" y="2000"/><use href="#tree" x="1960" y="2050"/><use href="#tree" x="2030" y="2010"/>
    <use href="#tree" x="1880" y="2110"/><use href="#tree" x="1950" y="2150"/><use href="#tree" x="2020" y="2110"/>
    <use href="#tree" x="2090" y="2070"/><use href="#tree" x="1820" y="2060"/>
    <use href="#tree" x="1200" y="1950"/><use href="#tree" x="1260" y="1990"/><use href="#tree" x="1140" y="2010"/>
    <use href="#tree" x="1210" y="2060"/>
  </g>
  <!-- Мертві ліси на пустищах -->
  <g>
    <use href="#deadtree" x="2200" y="1600"/><use href="#deadtree" x="2280" y="1660"/><use href="#deadtree" x="2380" y="1610"/>
    <use href="#deadtree" x="2470" y="1700"/><use href="#deadtree" x="2330" y="1750"/><use href="#deadtree" x="2560" y="1640"/>
    <use href="#deadtree" x="2900" y="1430"/><use href="#deadtree" x="2980" y="1490"/><use href="#deadtree" x="3040" y="1410"/>
  </g>

  <!-- Компас -->
  <g transform="translate(3550 450)" opacity="0.8">
    <circle r="140" fill="none" stroke="#8a7a5f" stroke-width="4"/>
    <circle r="110" fill="none" stroke="#8a7a5f" stroke-width="2" stroke-dasharray="6 10"/>
    <path d="M0 -150 L22 0 L0 150 L-22 0 Z" fill="#8a7a5f"/>
    <path d="M-150 0 L0 22 L150 0 L0 -22 Z" fill="#5a4e3c"/>
    <path d="M0 -150 L22 0 L-22 0 Z" fill="#c9b48a"/>
    <text y="-170" text-anchor="middle" font-family="Georgia, serif" font-size="60" fill="#c9b48a">П</text>
  </g>

  <!-- Назва світу -->
  <text x="2000" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="150" letter-spacing="40"
        fill="#c9b48a" opacity="0.55">ASHLANDS</text>
  <text x="2000" y="2880" text-anchor="middle" font-family="Georgia, serif" font-size="50" letter-spacing="10"
        fill="#8a7a5f" opacity="0.6">тимчасова карта</text>

  <!-- Рамка -->
  <rect x="20" y="20" width="3960" height="2960" fill="none" stroke="#8a7a5f" stroke-width="8" opacity="0.6"/>
  <rect x="44" y="44" width="3912" height="2912" fill="none" stroke="#8a7a5f" stroke-width="3" opacity="0.4"/>
</svg>
